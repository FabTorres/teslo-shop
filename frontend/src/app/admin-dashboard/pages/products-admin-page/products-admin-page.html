<h1 class="text-2xl font-bold">Listado de productos</h1>
<h3 class="text-lg">Total de productos
  <span class="text-accent">{{ productsResource.value()?.count }}</span>
</h3>

<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
  <app-pagination [pages]="productsResource.value()?.pages ?? 0" [currentPage]="paginationService.currentPage()" />

  <select
    class="select select-bordered w-32"
    (change)="onLimitChange(+selectPerPage.value)"
    #selectPerPage>
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>

  <div class="flex flex-1">
    <button
      class="btn btn-primary"
      routerLink="/admin/products/new">
  <svg
    xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 4v16m8-8H4"
    />
  </svg>

  Nuevo producto
</button>
  </div>

</div>

<!-- Listado -->
 @if (productsResource.hasValue()) {
   <product-table [products]="productsResource.value()!.products" />
 }
